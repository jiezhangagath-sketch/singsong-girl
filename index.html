<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>《海上花》互动体验</title>
  <link rel="stylesheet" href="style.css?v=62" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="eyebrow">《水浒传》被腰斩，《金瓶梅》是禁书，《红楼梦》没写完，《海上花》没人知道。</p>
      <h1>《海上花》互动体验</h1>
    </header>

    <!-- 顶部横向进度 -->
    <div id="progress-wrap" class="progress-wrap hidden">
      <div id="progress-visual" class="progress-visual"></div>
    </div>

    <!-- 主体内容区：叙事 + 原文并排 -->
    <div class="content-grid">
      <div class="narrative">
        <div id="character-card" class="character-card hidden"></div>
        <div id="scene-header" class="scene-header"></div>
        <div id="scene-content" class="scene-content"></div>
        <div id="choice-list" class="choice-list"></div>

        <div class="action-row">
          <button id="back-button" class="button button-secondary">返回上一步</button>
          <button id="reset-button" class="button button-secondary">回到序章</button>
        </div>
      </div>

      <!-- 原文摘录 -->
      <div id="source-panel" class="source-panel hidden">
        <div class="source-label">原文摘录</div>
        <div id="source-content" class="source-content">
          <div id="source-text" class="source-text"></div>
          <div id="source-commentary" class="source-commentary hidden"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- 云幕过渡：入梦 / 梦烟 -->
  <div id="cloud-curtain" class="cloud-curtain hidden">
    <!-- 第20回梦魇插图底图 -->
    <div class="dream-illustration" id="dream-illustration"></div>
    
    <!-- 底层墨晕：从右下角晕染扩散 -->
    <div class="cloud-ink-wash"></div>
    <div class="cloud-ink-blot"></div>
    <div class="cloud-mist"></div>
    <div class="cloud-drift drift-back"></div>
    <div class="cloud-drift drift-front"></div>
    <div class="cloud-particles" id="cloud-particles"></div>
    
    <!-- 真实云纹素材 -->
    <div class="cloud-image cloud-image-main" id="cloud-image-main"></div>
    <div class="cloud-image cloud-image-accent" id="cloud-image-accent"></div>
    
    <!-- 云朵文字容器：一朵连贯的卷云 -->
    <div class="cloud-text-container" id="cloud-text-container">
      <!-- 云尾：从右下角卷曲伸入 -->
      <div class="cloud-tail" id="cloud-tail">
        <div class="tail-segment tail-s1"></div>
        <div class="tail-segment tail-s2"></div>
        <div class="tail-segment tail-s3"></div>
      </div>
      <!-- 云头：主体蓬松区域 -->
      <div class="cloud-head" id="cloud-head">
        <div class="cloud-text-inner" id="cloud-text-inner"></div>
      </div>
      <div class="cloud-text-scroll-hint" id="cloud-text-scroll-hint">
        <span class="scroll-hint-icon">⬇</span>
        <span class="scroll-hint-text">向下滚动或点击继续</span>
      </div>
      <div class="cloud-choices" id="cloud-choices"></div>
    </div>
    <div class="cloud-stamp-hint" id="cloud-stamp-hint">点击继续</div>
  </div>

  <script src="script.js?v=62"></script>
</body>
</html>
