<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>《海上花》互动体验</title>
  <link rel="stylesheet" href="style.css?v=78" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="eyebrow">《水浒传》被腰斩，《金瓶梅》是禁书，《红楼梦》没写完，《海上花》没人知道。</p>
      <h1>《海上花》互动体验</h1>
    </header>

    <!-- 顶部横向进度 -->
    <div id="progress-wrap" class="progress-wrap hidden">
      <div id="progress-visual" class="progress-visual"></div>
    </div>

    <!-- 主体内容区：叙事 + 原文并排 -->
    <div class="content-grid">
      <div class="narrative">
        <div id="character-card" class="character-card hidden"></div>
        <div id="scene-header" class="scene-header"></div>
        <div id="scene-content" class="scene-content"></div>
        <div id="choice-list" class="choice-list"></div>

        <div class="action-row">
          <button id="back-button" class="button button-secondary">返回上一步</button>
          <button id="reset-button" class="button button-secondary">回到序章</button>
        </div>
      </div>

      <!-- 原文摘录 -->
      <div id="source-panel" class="source-panel hidden">
        <div class="source-label">原文摘录</div>
        <div id="source-content" class="source-content">
          <div id="source-text" class="source-text"></div>
          <div id="source-commentary" class="source-commentary hidden"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- 梦境过渡：第20回插图 + 跋文 -->
  <div id="cloud-curtain" class="cloud-curtain hidden">
    <!-- 氛围底图：模糊延展的插图，填补边距并营造梦境 -->
    <div class="dream-atmosphere" id="dream-atmosphere"></div>
    
    <!-- 第20回梦魇插图底图（人物已删除） -->
    <div class="dream-illustration" id="dream-illustration"></div>
    
    <!-- 淡墨晕染层 -->
    <div class="cloud-ink-wash"></div>
    <div class="cloud-mist"></div>
    
    <!-- 云纹边角装饰 -->
    <div class="dream-cloud dream-cloud-left"></div>
    <div class="dream-cloud dream-cloud-right"></div>
    
    <!-- 跋文：显示在插图原人物空白处 -->
    <div class="dream-text-panel" id="dream-text-panel">
      <div class="dream-text-title" id="dream-text-title"></div>
      <div class="dream-text-inner" id="dream-text-inner"></div>
      <div class="dream-text-hint" id="dream-text-hint">
        <span>⬇</span>
        <span>向下滚动或点击继续</span>
      </div>
    </div>
    
    <!-- 选择按钮 -->
    <div class="dream-choices" id="dream-choices"></div>
  </div>

  <!-- 物件界面 -->
  <div id="object-modal" class="object-modal hidden">
    <div class="object-modal-backdrop" id="object-modal-backdrop"></div>
    <div class="object-panel">
      <button class="object-close" id="object-close" aria-label="关闭">×</button>
      <h2 class="object-title" id="object-title">物件</h2>
      <div class="object-text" id="object-text"></div>
      <button class="object-reveal-button" id="object-reveal-btn">收获物件</button>
      <div class="object-image-wrap hidden" id="object-image-wrap"></div>
      <div class="object-actions">
        <button class="dream-choice-button" id="object-return-btn">返回序幕</button>
      </div>
    </div>
  </div>

  <script src="script.js?v=78"></script>
</body>
</html>
