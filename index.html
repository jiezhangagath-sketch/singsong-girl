<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>《海上花》互动体验</title>
  <link rel="stylesheet" href="style.css?v=51" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="eyebrow">《水浒传》被腰斩，《金瓶梅》是禁书，《红楼梦》没写完，《海上花》没人知道。</p>
      <h1>《海上花》互动体验</h1>
    </header>

    <!-- 顶部横向进度 -->
    <div id="progress-wrap" class="progress-wrap hidden">
      <div id="progress-visual" class="progress-visual"></div>
    </div>

    <!-- 主体内容区：叙事 + 原文并排 -->
    <div class="content-grid">
      <div class="narrative">
        <div id="character-card" class="character-card hidden"></div>
        <div id="scene-header" class="scene-header"></div>
        <div id="scene-content" class="scene-content"></div>
        <div id="choice-list" class="choice-list"></div>

        <div class="action-row">
          <button id="back-button" class="button button-secondary">返回上一步</button>
          <button id="reset-button" class="button button-secondary">回到序章</button>
        </div>
      </div>

      <!-- 原文摘录 -->
      <div id="source-panel" class="source-panel hidden">
        <div class="source-label">原文摘录</div>
        <div id="source-content" class="source-content">
          <div id="source-text" class="source-text"></div>
          <div id="source-commentary" class="source-commentary hidden"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- 云幕过渡 -->
  <div id="cloud-curtain" class="cloud-curtain hidden">
    <div class="cloud-panel cloud-panel-left">
      <svg class="cloud-edge cloud-edge-right" viewBox="0 0 200 600" preserveAspectRatio="none">
        <path d="M120,0 L0,0 L0,600 L120,600 
                 C160,590 190,560 160,530
                 C200,500 180,470 150,440
                 C190,410 170,380 140,350
                 C180,320 160,290 130,260
                 C170,230 150,200 120,170
                 C160,140 140,110 110,80
                 C150,50 130,20 120,0 Z" />
      </svg>
    </div>
    <div class="cloud-panel cloud-panel-right">
      <svg class="cloud-edge cloud-edge-left" viewBox="0 0 200 600" preserveAspectRatio="none">
        <path d="M120,0 L0,0 L0,600 L120,600 
                 C160,590 190,560 160,530
                 C200,500 180,470 150,440
                 C190,410 170,380 140,350
                 C180,320 160,290 130,260
                 C170,230 150,200 120,170
                 C160,140 140,110 110,80
                 C150,50 130,20 120,0 Z" />
      </svg>
    </div>
  </div>

  <script src="script.js?v=51"></script>
</body>
</html>
