<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>《海上花》互动体验</title>
  <link rel="stylesheet" href="style.css?v=52" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="eyebrow">《水浒传》被腰斩，《金瓶梅》是禁书，《红楼梦》没写完，《海上花》没人知道。</p>
      <h1>《海上花》互动体验</h1>
    </header>

    <!-- 顶部横向进度 -->
    <div id="progress-wrap" class="progress-wrap hidden">
      <div id="progress-visual" class="progress-visual"></div>
    </div>

    <!-- 主体内容区：叙事 + 原文并排 -->
    <div class="content-grid">
      <div class="narrative">
        <div id="character-card" class="character-card hidden"></div>
        <div id="scene-header" class="scene-header"></div>
        <div id="scene-content" class="scene-content"></div>
        <div id="choice-list" class="choice-list"></div>

        <div class="action-row">
          <button id="back-button" class="button button-secondary">返回上一步</button>
          <button id="reset-button" class="button button-secondary">回到序章</button>
        </div>
      </div>

      <!-- 原文摘录 -->
      <div id="source-panel" class="source-panel hidden">
        <div class="source-label">原文摘录</div>
        <div id="source-content" class="source-content">
          <div id="source-text" class="source-text"></div>
          <div id="source-commentary" class="source-commentary hidden"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- 云幕过渡 -->
  <div id="cloud-curtain" class="cloud-curtain hidden">
    <div class="cloud-mist"></div>
    <div class="cloud-panel cloud-panel-left">
      <svg class="cloud-edge cloud-edge-right" viewBox="0 0 200 600" preserveAspectRatio="none">
        <path d="M120,0 L0,0 L0,600 L120,600 
                 C150,590 175,575 165,555
                 C185,535 195,515 175,495
                 C190,475 200,455 180,435
                 C195,415 185,395 165,375
                 C180,355 190,335 170,315
                 C185,295 195,275 175,255
                 C190,235 185,215 165,195
                 C180,175 195,155 175,135
                 C190,115 200,95 180,75
                 C195,55 185,35 165,15
                 C175,5 150,2 120,0 Z" fill="#c9a875" opacity="0.35" />
        <path d="M120,0 L0,0 L0,600 L120,600 
                 C140,592 160,580 150,560
                 C170,540 180,520 165,500
                 C175,480 185,460 170,440
                 C180,420 170,400 155,380
                 C170,360 180,340 165,320
                 C175,300 185,280 170,260
                 C180,240 170,220 155,200
                 C170,180 180,160 165,140
                 C175,120 185,100 170,80
                 C180,60 170,40 155,20
                 C165,8 145,3 120,0 Z" fill="#e0c69a" opacity="0.22" />
      </svg>
    </div>
    <div class="cloud-panel cloud-panel-right">
      <svg class="cloud-edge cloud-edge-left" viewBox="0 0 200 600" preserveAspectRatio="none">
        <path d="M120,0 L0,0 L0,600 L120,600 
                 C150,590 175,575 165,555
                 C185,535 195,515 175,495
                 C190,475 200,455 180,435
                 C195,415 185,395 165,375
                 C180,355 190,335 170,315
                 C185,295 195,275 175,255
                 C190,235 185,215 165,195
                 C180,175 195,155 175,135
                 C190,115 200,95 180,75
                 C195,55 185,35 165,15
                 C175,5 150,2 120,0 Z" fill="#c9a875" opacity="0.35" />
        <path d="M120,0 L0,0 L0,600 L120,600 
                 C140,592 160,580 150,560
                 C170,540 180,520 165,500
                 C175,480 185,460 170,440
                 C180,420 170,400 155,380
                 C170,360 180,340 165,320
                 C175,300 185,280 170,260
                 C180,240 170,220 155,200
                 C170,180 180,160 165,140
                 C175,120 185,100 170,80
                 C180,60 170,40 155,20
                 C165,8 145,3 120,0 Z" fill="#e0c69a" opacity="0.22" />
      </svg>
    </div>
  </div>

  <script src="script.js?v=52"></script>
</body>
</html>
